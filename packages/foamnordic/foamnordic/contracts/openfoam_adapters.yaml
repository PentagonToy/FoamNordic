schema: foamnordic.openfoam-adapters

adapters:
  kEqnFjord:
    category: les_model
    native_execution:
      - transport
    inputs:
      k:
        kind: scalar
      grad(U):
        kind: tensor
      nu:
        kind: scalar
      delta:
        kind: scalar
    outputs:
      k:
        kind: scalar
      nut:
        kind: scalar

  nutFjord:
    category: les_model
    native_execution:
      - algebra
    inputs:
      grad(U):
        kind: tensor
      delta:
        kind: scalar
    outputs:
      nut:
        kind: scalar

  progressRateFjord:
    category: combustion_model
    native_execution: []
    inputs:
      progress:
        kind: scalar
      variance:
        kind: scalar
      temperature:
        kind: scalar
    outputs:
      omega_c:
        kind: scalar
