name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/docs/**'
      - 'others/**/*.svg'
      - 'tutorials/README.md'
      - 'tutorials/foamnordic_tutorials/**/*.ipynb'
      - 'README.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read companion documentation revision
        id: stack
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          ref = Path('tools/docs/stacknordic.ref').read_text().strip()
          assert re.fullmatch(r'[0-9a-f]{40}', ref)
          print(f'ref={ref}')
          PY
      - uses: actions/checkout@v7
        with:
          repository: PentagonToy/StackNordic
          ref: ${{ steps.stack.outputs.ref }}
          path: .sources/StackNordic
          persist-credentials: false
          sparse-checkout: |
            README.md
            docs
            others
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/configure-pages@v6
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation
        env:
          STACKNORDIC_DOCS_ROOT: .sources/StackNordic
        run: python tools/docs/build.py --workspace "$RUNNER_TEMP/nordic-docs" --site-dir site
      - name: Check generated documentation
        run: python tools/docs/check_site.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
