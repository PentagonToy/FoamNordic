name: Build release wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate release metadata and extract changelog
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 -m pip install "pytest>=8,<10"
          python3 -m pytest others/release/tests -q
          if [ "$REF_TYPE" = tag ]; then
            python3 others/release/release_notes.py --tag "$REF_NAME" > release-notes.md
          else
            python3 others/release/release_notes.py > release-notes.md
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  source-tests:
    needs: release-notes
    name: Source tests (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
          - label: macOS arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install source workspace
        run: uv sync --all-packages --extra ml --frozen

      - name: Run Python test suite
        run: uv run python -m pytest

  wheels:
    needs: release-notes
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
          - label: macOS arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test Python 3.11 and 3.12 wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: packages/foamnordic
          output-dir: wheelhouse
          config-file: packages/foamnordic/pyproject.toml
          extras: uv

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: foamnordic-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error
