name: Build release wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
          - label: macOS arm64
            runner: macos-14

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test Python 3.11 and 3.12 wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse
          config-file: python/pyproject.toml

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: foamnordic-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error
